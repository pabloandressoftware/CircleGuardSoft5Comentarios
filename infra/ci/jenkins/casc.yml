jenkins:
  numExecutors: 1
  labelString: "docker"
  quietPeriod: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${CI_JENKINS_USER}"
          password: "${CI_JENKINS_PASSWORD}"
        # HU-10: unico usuario autorizado a aprobar el despliegue a prod.
        - id: "${CI_APPROVER_USER}"
          password: "${CI_APPROVER_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  gitHubConfiguration:
    apiRateLimitChecker: NoThrottle
  globalLibraries:
    libraries:
      - name: "circleguard"
        defaultVersion: "dev"
        implicit: false
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            libraryPath: "jenkins"
            scm:
              git:
                id: "circleguard-shared-library"
                remote: "https://github.com/pabloandressoftware/CircleGuardSoft5Comentarios.git"
                credentialsId: "${CI_GITHUB_CREDENTIALS_ID}"

jobs:
  - script: |
      multibranchPipelineJob('circleguard') {
        displayName('CircleGuard Multibranch')
        description('Descubre las ramas del monorepo y construye solo los servicios modificados.')

        branchSources {
          github {
            id('circleguard-github')
            repoOwner('pabloandressoftware')
            repository('CircleGuardSoft5Comentarios')
            scanCredentialsId('${CI_GITHUB_CREDENTIALS_ID}')
            checkoutCredentialsId('${CI_GITHUB_CREDENTIALS_ID}')
          }
        }

        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }

        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }

        // HU-10: ademas de ramas y PR, descubrir los tags de release (vX.Y.Z).
        // El DSL de alto nivel no expone TagDiscoveryTrait; se inyecta en el XML.
        configure { project ->
          project / 'sources' / 'data' / 'jenkins.branch.BranchSource' / 'source' / 'traits' <<
            'org.jenkinsci.plugins.github__branch__source.TagDiscoveryTrait' { }
        }
      }
