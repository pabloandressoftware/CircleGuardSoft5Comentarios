services:
  jenkins:
    build:
      context: ./jenkins
    environment:
      CASC_JENKINS_CONFIG: /opt/jenkins/casc.yml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx768m
      CI_JENKINS_USER: ${CI_JENKINS_USER:?Define CI_JENKINS_USER}
      CI_JENKINS_PASSWORD: ${CI_JENKINS_PASSWORD:?Define CI_JENKINS_PASSWORD}
      CI_GITHUB_CREDENTIALS_ID: ${CI_GITHUB_CREDENTIALS_ID:-}
    ports:
      - "127.0.0.1:${CI_JENKINS_PORT:-8181}:8080"
    group_add:
      - "${CI_DOCKER_GID:-0}"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  sonar-db:
    image: postgres:16
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${CI_SONAR_DB_PASSWORD:?Define CI_SONAR_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar", "-d", "sonar"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  sonarqube:
    image: sonarqube:25.11.0.114957-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${CI_SONAR_DB_PASSWORD:?Define CI_SONAR_DB_PASSWORD}
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CI_SONAR_PORT:-9000}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:3.90.3
    environment:
      INSTALL4J_ADD_VM_PARAMS: -Xms512m -Xmx768m -XX:MaxDirectMemorySize=768m -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    ports:
      - "127.0.0.1:${CI_NEXUS_PORT:-8081}:8081"
      - "127.0.0.1:${CI_REGISTRY_PORT:-5000}:5000"
    volumes:
      - nexus-data:/nexus-data
    restart: unless-stopped

  init:
    profiles: [setup]
    build:
      context: ./init
    environment:
      CI_JENKINS_USER: ${CI_JENKINS_USER:?Define CI_JENKINS_USER}
      CI_JENKINS_PASSWORD: ${CI_JENKINS_PASSWORD:?Define CI_JENKINS_PASSWORD}
      CI_GITHUB_USER: ${CI_GITHUB_USER:-x-access-token}
      CI_GITHUB_TOKEN: ${CI_GITHUB_TOKEN:-}
      CI_SONAR_PASSWORD: ${CI_SONAR_PASSWORD:?Define CI_SONAR_PASSWORD}
      CI_SONAR_INITIAL_PASSWORD: ${CI_SONAR_INITIAL_PASSWORD:-}
      CI_NEXUS_PASSWORD: ${CI_NEXUS_PASSWORD:?Define CI_NEXUS_PASSWORD}
    volumes:
      - nexus-data:/nexus-data:ro

volumes:
  jenkins-data:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  nexus-data:
