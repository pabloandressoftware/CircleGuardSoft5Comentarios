server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fallback SPA: una ruta profunda (p. ej. /admin/spatial/...) carga la app
        # en lugar de devolver 404 cuando el export estatico no genero ese HTML.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
