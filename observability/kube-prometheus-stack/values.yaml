# HU-24 · Valores del stack de observabilidad para CircleGuard.
# Instalar con observability/instalar.sh (crea los Secrets antes del Helm).
grafana:
  adminUser: admin
  # El script crea este Secret desde GRAFANA_ADMIN_PASSWORD.
  admin:
    existingSecret: grafana-admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      searchNamespace: ALL
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="critical"
          receiver: discord
    receivers:
      - name: discord
        discord_configs:
          # El mismo webhook de Spidey que usa Jenkins (credencial discord-webhook).
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            message: |
              {{ range .Alerts }}{{ .Annotations.description }}
              {{ end }}
  alertmanagerSpec:
    secrets:
      - alertmanager-discord
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 256Mi }

prometheusOperator:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 512Mi }
