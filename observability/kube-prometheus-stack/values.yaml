# HU-24 · Valores del stack de observabilidad para CircleGuard.
# Instalar con observability/instalar.sh (crea los Secrets antes del Helm).
grafana:
  adminUser: admin
  # El script crea este Secret desde GRAFANA_ADMIN_PASSWORD.
  admin:
    existingSecret: grafana-admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      searchNamespace: ALL
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }

alertmanager:
  # HU-24: la configuracion completa vive en un Secret (`alertmanager-config`) para
  # poder usar `webhook_url`. El chart 65.5.1 trae Alertmanager v0.27.0, que falla
  # al validar `webhook_url_file` ("no discord webhook URL provided").
  alertmanagerSpec:
    configSecret: alertmanager-config
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 256Mi }

prometheusOperator:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 512Mi }
