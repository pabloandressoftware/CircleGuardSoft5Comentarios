# HU-24 · Valores del stack de observabilidad para CircleGuard.
# Instalar con observability/instalar.sh (crea los Secrets antes del Helm).
grafana:
  adminUser: admin
  # El script crea este Secret desde GRAFANA_ADMIN_PASSWORD.
  admin:
    existingSecret: grafana-admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      searchNamespace: ALL
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }

alertmanager:
  # Configuracion por defecto SIN notificaciones externas: las alertas quedan
  # visibles en la API/UI de Alertmanager (receptor "local", sin integraciones).
  # El chart fijado trae Alertmanager 0.27, que no admite webhook_url_file en
  # discord_configs. Si se define CI_DISCORD_WEBHOOK, instalar.sh crea un Secret
  # con la configuracion completa (incluido Discord) y lo activa con
  # alertmanagerSpec.configSecret; el webhook nunca se escribe en este archivo.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: local
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: local
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 256Mi }

prometheusOperator:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 512Mi }
