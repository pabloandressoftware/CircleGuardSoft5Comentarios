# HU-18 · OpenLDAP para auth-service (misma imagen que Docker Compose).
# La contrasena de administrador sale del Secret circleguard-secrets (clave LDAP_PASSWORD).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  labels: { app.kubernetes.io/name: openldap, app.kubernetes.io/part-of: circleguard }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: openldap }
  template:
    metadata:
      labels: { app.kubernetes.io/name: openldap, app.kubernetes.io/part-of: circleguard }
    spec:
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          ports:
            - { name: ldap, containerPort: 389 }
          env:
            - { name: LDAP_ORGANISATION, value: CircleGuard }
            - { name: LDAP_DOMAIN, value: circleguard.edu }
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: circleguard-secrets, key: LDAP_PASSWORD }
          readinessProbe:
            tcpSocket: { port: ldap }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
spec:
  selector: { app.kubernetes.io/name: openldap }
  ports:
    - { name: ldap, port: 389, targetPort: ldap }
