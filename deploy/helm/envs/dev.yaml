# HU-18 · valores del ambiente dev (se pasan despues del values del servicio).
# La etiqueta de imagen la pone el pipeline con --set image.tag=vX.Y.Z (la misma en todos).
env:
  CORS_ALLOWED_ORIGINS: "https://dev.circleguard.local"
ingress:
  host: dev.circleguard.local
  # HU-21: cert-manager emite el certificado autofirmado para este Ingress.
  annotations:
    cert-manager.io/cluster-issuer: circleguard-selfsigned
  tls:
    - secretName: circleguard-dev-tls
      hosts:
        - dev.circleguard.local
