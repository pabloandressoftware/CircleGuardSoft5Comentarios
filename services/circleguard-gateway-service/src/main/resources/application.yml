# Configuracion externalizada (HU-07)
spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  # Debe ser el MISMO valor que en auth-service: gateway verifica la firma del QR
  secret: ${QR_SECRET}
  expiration: ${QR_EXPIRATION:60000}

server:
  port: 8087
  forward-headers-strategy: native

# HU-18: sondas de Kubernetes (/actuator/health/liveness y /readiness) y metricas
# (/actuator/prometheus). El Ingress no publica /actuator; solo se usa dentro del cluster.
management:
  metrics:
    tags:
      # HU-24: agrupa las metricas por servicio en Prometheus/Grafana.
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
