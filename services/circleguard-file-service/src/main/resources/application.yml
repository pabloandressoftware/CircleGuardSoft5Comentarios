# Configuracion externalizada (HU-07)
spring:
  application:
    name: circleguard-file-service
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

# Placeholder for S3/MinIO configuration if needed later
# aws:
#   s3:
#     endpoint: ${S3_ENDPOINT}
#     access-key: ${S3_ACCESS_KEY}
#     secret-key: ${S3_SECRET_KEY}

server:
  port: 8085
  forward-headers-strategy: native

# HU-18: sondas de Kubernetes (/actuator/health/liveness y /readiness) y metricas
# (/actuator/prometheus). El Ingress no publica /actuator; solo se usa dentro del cluster.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
