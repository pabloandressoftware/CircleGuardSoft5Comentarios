# Configuracion externalizada (HU-07)
spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

auth:
  api:
    url: ${AUTH_API_URL:http://localhost:8180}

identity:
  api:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8083}

lms:
  api:
    url: ${LMS_API_URL:https://lms.university.edu/api/v1}

room:
  booking:
    api:
      url: ${ROOM_BOOKING_API_URL:https://facilities.university.edu/api/v1/rooms}

push:
  gotify:
    url: ${GOTIFY_URL:http://localhost:8080}
    token: ${GOTIFY_TOKEN:MOCK_TOKEN}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:AC_MOCK_SID}
  auth-token: ${TWILIO_AUTH_TOKEN:MOCK_TOKEN}
  from-number: ${TWILIO_FROM_NUMBER:+15550000000}

jwt:
  secret: ${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  secret: ${QR_SECRET:my-qr-secret-key-for-dev-1234567890}
  expiration: ${QR_EXPIRATION:60000}

server:
  port: 8082
  forward-headers-strategy: native
