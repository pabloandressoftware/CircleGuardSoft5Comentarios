# Configuracion externalizada (HU-07). Cada valor sale de una variable de entorno;
# el valor por defecto solo sirve para desarrollo local con docker-compose.dev.yml.
spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/circleguard_auth
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:dc=circleguard,dc=edu}
    username: ${LDAP_USERNAME:cn=admin,dc=circleguard,dc=edu}
    password: ${LDAP_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  secret: ${QR_SECRET}
  # Milisegundos. 60000 = 60 s (antes 300 = 0,3 s por error de unidades)
  expiration: ${QR_EXPIRATION:60000}

circleguard:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8083}
  # HU-21: clave compartida entre servicios para llamadas internas sin JWT.
  internal:
    api-key: ${INTERNAL_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

server:
  port: 8180
  forward-headers-strategy: native

# HU-18: sondas de Kubernetes (/actuator/health/liveness y /readiness) y metricas
# (/actuator/prometheus). El Ingress no publica /actuator; solo se usa dentro del cluster.
management:
  metrics:
    tags:
      # HU-24: agrupa las metricas por servicio en Prometheus/Grafana.
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
