# Configuracion externalizada (HU-07)
spring:
  application:
    name: circleguard-form-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/circleguard_form
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Los eventos se publican como Map: sin cabecera __TypeId__ promotion los
        # deserializa como HashMap y no como la clase interna de Map.of().
        spring.json.add.type.headers: false

server:
  port: 8086
  forward-headers-strategy: native

# HU-21: los endpoints administrativos validan el JWT de auth-service.
jwt:
  secret: ${JWT_SECRET}

# HU-18: sondas de Kubernetes (/actuator/health/liveness y /readiness) y metricas
# (/actuator/prometheus). El Ingress no publica /actuator; solo se usa dentro del cluster.
management:
  metrics:
    tags:
      # HU-24: agrupa las metricas por servicio en Prometheus/Grafana.
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# HU-25: el agente de OpenTelemetry pone trace_id y span_id en el MDC; se imprimen para que
# Loki permita filtrar por traceId. Sin el agente (Compose, pruebas) quedan vacios.
logging:
  pattern:
    level: "%5p [${spring.application.name:},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
