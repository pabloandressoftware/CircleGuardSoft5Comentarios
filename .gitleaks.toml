# HU-20 · Configuracion de gitleaks.
# Parte de las reglas por defecto y solo exime claves que son datos de prueba
# (tests) o plantillas de ejemplo; nunca codigo de produccion ni configuracion real.
[extend]
useDefault = true

[allowlist]
description = "Claves de prueba y ejemplos"
paths = [
  '''src/test/''',
  # Reportes y resultados de pruebas generados por Gradle en el workspace de CI:
  # repiten los datos falsos de src/test/. El resto de build/ sigue analizandose.
  '''services/[^/]+/build/(reports/tests|test-results)/''',
  '''(^|/)\.env\.example$''',
  '''docs/''',
]
