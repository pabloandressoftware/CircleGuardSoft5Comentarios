name: commitlint

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar commitlint
        run: npm install --no-save --no-package-lock @commitlint/cli@19.5.0 @commitlint/config-conventional@19.5.0
      - name: Validar Conventional Commits del PR
        run: >
          npx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
